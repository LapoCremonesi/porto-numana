<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.5; color: #1a1a19; }
    a { color: #31596b; text-decoration: none; }
    a:hover { color: #24434f; }
  </style>
</helmet>

<div style="width: 1440px; height: 880px; display: flex; flex-direction: column; background: #ffffff; overflow: hidden;">

  <div style="flex: 0 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 30px; padding: 0 18.75px; height: 52px; border-bottom: 1px solid #e5e4e0;">
    <div style="display: flex; align-items: baseline; gap: 9px;">
      <div style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #1a1a19;">Porto di Numana</div>
      <div style="font-size: 13px; color: #8b8880;">Riviera del Conero</div>
    </div>
    <div style="display: flex; align-self: stretch; gap: 21px;">
      <div style="display: flex; align-items: center; height: 100%; font-size: 13px; color: #1a1a19; border-bottom: 2px solid #1a1a19;">Satellite</div>
      <div style="display: flex; align-items: center; height: 100%; font-size: 13px; color: #8b8880; border-bottom: 2px solid transparent;">Modello 3D</div>
      <div style="display: flex; align-items: center; height: 100%; font-size: 13px; color: #8b8880; border-bottom: 2px solid transparent;">Scheda</div>
    </div>
  </div>

  <div style="flex: 1 1 auto; display: grid; grid-template-columns: 320px 1fr; min-height: 0;">

    <div style="display: flex; flex-direction: column; min-height: 0; border-right: 1px solid #e5e4e0;">

      <div style="flex: 0 0 auto; padding: 15px 18.75px 12.75px; border-bottom: 1px solid #e5e4e0;">
        <div style="padding: 6.75px 0; font-size: 14px; color: #8b8880; border-bottom: 1px solid #cfcdc7;">Cerca un'attività o un servizio</div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 11.25px; margin-top: 12.75px;">
          <div style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: #57554f;">
            <span>Tutte le categorie</span>
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#8b8880" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.75 L5 6.75 L8 3.75"></path></svg>
          </div>
          <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #8b8880;">19 attività</div>
        </div>
      </div>

      <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column;">
        <sc-for list="{{voci}}" as="v" hint-placeholder-count="9">
          <div style="padding: 10.5px 18.75px; border-bottom: 1px solid #e5e4e0;">
            <div style="font-size: 14px; font-weight: 500; line-height: 1.35; color: #1a1a19;">{{v.nome}}</div>
            <div style="margin-top: 2.25px; font-size: 12.5px; color: #8b8880;">{{v.settore}}</div>
          </div>
        </sc-for>
      </div>

    </div>

    <div style="position: relative; overflow: hidden; background: #1c1d1c;">
      <img src="satellite.jpg" alt="Vista satellitare del Porto di Numana" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;">
      <div style="position: absolute; left: 12.75px; bottom: 12.75px; max-width: 420px; padding: 6.75px 9.75px; font-size: 12px; line-height: 1.5; color: #57554f; background: rgba(255,255,255,0.94); border: 1px solid #e5e4e0; border-radius: 4px;">Immagine satellitare attuale. Sopra sono tracciati diga foranea, scogliere e pontili come mappati su OpenStreetMap.</div>
      <div style="position: absolute; right: 12.75px; bottom: 12.75px; padding: 4.8px 9px; font-size: 12px; color: #57554f; background: rgba(255,255,255,0.94); border: 1px solid #cfcdc7; border-radius: 4px;">Mappa</div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accento":{"editor":"color","default":"#31596b","section":"Palette","tsType":"string"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accento: this.props.accento ?? '#31596b',
      voci: [
        { nome: 'Circolo Nautico Numana “S. Massaccesi”', settore: 'Area nord — pontili del circolo' },
        { nome: 'Lega Navale Italiana — Sezione di Numana', settore: 'Molo sud — Piazzale S. Massaccesi' },
        { nome: 'Cooperativa Ormeggiatori Porto di Numana', settore: 'Pontili centrali' },
        { nome: 'Punto Mare', settore: 'Banchina — consegna gommoni' },
        { nome: 'Cantiere Navale Jurini', settore: 'Retro-banchina' },
        { nome: 'Traghettatori del Conero', settore: 'Banchina imbarco passeggeri' },
        { nome: 'Banchina dei Pescatori', settore: 'Associazione Pescatori Numana' },
        { nome: 'Ufficio Locale Marittimo — Guardia Costiera', settore: 'Piazzale S. Massaccesi' },
        { nome: 'Distributore carburante del porto', settore: 'Imboccatura sud' }
      ]
    };
  }
}
</script>
</body>
</html>
